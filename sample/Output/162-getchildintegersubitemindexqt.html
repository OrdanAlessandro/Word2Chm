<div class="page"><h5 id="getchild-integer-subitemindex-qt">GetChild(integer <em>subItemIndex</em>) [Qt]</h5>
<p>Ritorna il figlio di indice specificato dell&#8217;elemento corrente. Valido solo per elementi di tipo subBatch. Con <em>subItemIndex</em>=0 ritorna il primo figlio. Valori validi per <em>subItemIndex</em><em> </em>sono compresi tra 0 e GetChildCount()-1</p>
