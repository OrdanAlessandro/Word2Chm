<div class="page"><h5 id="getsibling-integer-relativeindex-qt">GetSibling(integer <em>relativeIndex</em>) [Qt]</h5>
<p>Ritorna un elemento posizionato attorno all&#8217;elemento corrente e allo stesso livello di gerarchia. GetSibling(0) ritorna l&#8217;elemento stesso, GetSibling(-1) ritorna il precedente, se presente, GetSibling(1) il successivo.</p>
