<div class="page"><h4 id="skipper-log-string-message">Skipper.Log(string message)</h4>
<p>Aggiunge un messaggio di log alla diagnostica di Skipper. Il messaggio viene visualizzato nel pannello messaggi ed inserito nel corrispondente file di Log.</p>
<p><strong>Parametri</strong></p>
<ul>
<li class="level-0"><em>message</em> (stringa): messaggio da registrare</li>
</ul>
